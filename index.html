<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maximiliano Bottazzi</title>
  <meta name="description" content="Personal site of Maximiliano Bottazzi — CV and projects.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c2410c'/><text x='50' y='70' font-family='Georgia,serif' font-size='62' font-weight='700' text-anchor='middle' fill='white'>B</text></svg>">
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141211;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #2c2927;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 9vw, 4.25rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .lead {
      margin: 1.25rem 0 0;
      font-size: 1.2rem;
      color: var(--muted);
    }
    section { margin-top: 4rem; }
    h2 {
      margin: 0 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 0;
    }
    li small { color: var(--muted); font-size: 0.9rem; }
    a {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-underline-offset: 0.2em;
    }
    a:hover { color: var(--accent); }
    .empty { color: var(--muted); margin: 0; }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Maximiliano Bottazzi<span>.</span></h1>
    <p class="lead">Computer scientist — CV and projects coming soon.</p>

    <section>
      <h2>Projects</h2>
      <!-- One <li> per project, each linking to its subdomain:
      <ul>
        <li><a href="https://app.bottazzi.de">app.bottazzi.de</a> <small>Short description</small></li>
      </ul>
      -->
      <p class="empty">Nothing here yet — projects will live on subdomains of bottazzi.de.</p>
    </section>
  </main>

  <footer>© 2026 Maximiliano Bottazzi</footer>
</body>
</html>
