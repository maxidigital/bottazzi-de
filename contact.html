<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Maximiliano Bottazzi</title>
  <meta name="description" content="Get in touch with Maximiliano Bottazzi — IT consulting for businesses and software development for humans.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a855f7'/><stop offset='1' stop-color='%2338bdf8'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='70' font-family='system-ui,sans-serif' font-size='60' font-weight='700' text-anchor='middle' fill='%23141625'>B</text></svg>">
  <link rel="stylesheet" href="/style.css?v=2">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="site-header">
    <a class="brand" href="/">bottazzi.de</a>
    <nav><a href="/#projects">Projects</a><a href="/contact.html">Contact</a></nav>
  </header>
  <main class="page">
    <h1>Contact<span>.</span></h1>
    <p class="lead">Tell me what you need — I'll get back to you by e-mail.</p>

    <section>
      <form id="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required maxlength="200" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required maxlength="200" autocomplete="email">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="5000" rows="6"></textarea>
        </div>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADGUHe7slzg-gxzC" data-theme="auto"></div>
        <button type="submit">Send message</button>
        <p class="form-feedback" id="form-feedback" role="status" hidden></p>
        <p class="form-note">Your message is sent to me by e-mail. Details in the <a href="/privacy.html">privacy notice</a>.</p>
      </form>
    </section>
  </main>

  <footer>© 2026 Maximiliano Bottazzi · <a href="/">Home</a> · <a href="/privacy.html">Privacy</a></footer>

  <script>
    const form = document.getElementById('contact-form');
    const feedback = document.getElementById('form-feedback');

    const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const showFeedback = (text, kind) => {
      feedback.textContent = text;
      feedback.className = 'form-feedback ' + kind;
      feedback.hidden = false;
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('[type="submit"]');
      feedback.hidden = true;

      const name    = form.elements.name.value.trim();
      const email   = form.elements.email.value.trim();
      const message = form.elements.message.value.trim();
      const token   = form.querySelector('[name="cf-turnstile-response"]')?.value;

      if (!token) {
        showFeedback('Please wait for the security check to finish, then try again.', 'error');
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch('https://underwater-backend-services.up.railway.app/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            app: 'bottazzi-de',
            from: 'noreply@maxibottazzi.de',
            fromName: 'bottazzi.de — Contact',
            to: 'maxidigital@gmail.com',
            subject: `Contact bottazzi.de — ${name} (${email})`,
            html: `
              <p><strong>Name:</strong> ${escapeHtml(name)}</p>
              <p><strong>E-mail:</strong> <a href="mailto:${escapeHtml(email)}">${escapeHtml(email)}</a></p>
              <p><strong>Message:</strong><br>${escapeHtml(message).replace(/\n/g, '<br>')}</p>
            `,
            turnstileToken: token,
          }),
        });
        if (res.ok) {
          form.reset();
          showFeedback("Message sent. I'll reply soon.", 'success');
        } else if (res.status === 429) {
          showFeedback('Too many messages from this connection. Please try again later.', 'error');
        } else {
          showFeedback('Something went wrong. Please try again.', 'error');
        }
      } catch {
        showFeedback('Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        // Turnstile tokens are single-use
        window.turnstile?.reset();
      }
    });
  </script>
</body>
</html>
