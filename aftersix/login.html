<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — After Six</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23141010'/><text x='50' y='72' font-family='system-ui,sans-serif' font-size='68' font-weight='800' text-anchor='middle' fill='%23d4f53c'>X</text></svg>">
  <link rel="stylesheet" href="/aftersix/style.css?v=2">
</head>
<body data-title="title.login">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="site-header">
    <a class="header-logo" href="/aftersix/"><img src="/aftersix/logo.svg" alt="After Six" width="2880" height="848"></a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <main class="login-page">
    <span class="tag" data-i18n="login.tag">Client portal</span>
    <h1 class="grad" data-i18n="login.title">Log in</h1>
    <p class="login-lead" data-i18n="login.lead">Access your campaigns, reports and results.</p>

    <!-- Posts to aftersix-admin on Railway, which redirects back here with ?error= on failure. -->
    <form id="login-form" class="card login-card" method="post" action="https://aftersix.bottazzi.de/login">
      <div class="field">
        <label for="login-user" data-i18n="login.user">User</label>
        <input type="text" id="login-user" name="user" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="login-password" data-i18n="login.password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary" data-i18n="login.submit">Log in</button>
      <p class="form-feedback error" id="login-wrong" role="alert" hidden data-i18n="login.wrong">Incorrect user or password.</p>
      <p class="form-feedback error" id="login-toomany" role="alert" hidden data-i18n="login.toomany">Too many attempts. Please try again in 15 minutes.</p>
    </form>

    <a class="back" href="/aftersix/#apply" data-i18n="login.back">← Back to After Six</a>
  </main>

  <footer>© 2026 After Six · Digital Marketing</footer>
  <script src="/aftersix/i18n.js?v=3"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    const error = new URLSearchParams(location.search).get('error');
    if (error === 'wrong' || error === 'toomany') document.getElementById('login-' + error).hidden = false;
    loginForm.addEventListener('submit', () => {
      loginForm.querySelector('[type="submit"]').disabled = true;
    });
  </script>
</body>
</html>
